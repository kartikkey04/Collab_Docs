services:
  postgres:
    image: postgres:16
    container_name: collab-postgres-server

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab_docs

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: collab-redis-server

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: